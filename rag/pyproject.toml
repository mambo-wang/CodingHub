[project]
name = "wandering-rag"
version = "0.2.0"
description = "RAG knowledge base REST API service using zvec and Qwen3-Embedding"
requires-python = ">=3.10"
dependencies = [
    "zvec>=0.5.0",
    "sentence-transformers>=3.0",
    "markitdown[all]>=0.1",
    "python-multipart>=0.0.6",
]

[project.scripts]
wandering-rag = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
