name: default
version: 1
description: 默认 OpenSpec 工作流——经典四阶段：提案→规格→设计→任务

artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更提案——为什么要做、做什么、验收标准
    template: proposal.md
    instruction: |
      创建一份变更提案，说清楚以下内容：
      - **问题描述**：当前存在什么问题，为什么需要这个变更
      - **解决方案概述**：准备怎么做（概要，不涉及实现细节）
      - **验收标准**：完成后如何验证，列出可检查的条件
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: 功能规格——详细描述期望行为
    template: spec.md
    instruction: |
      编写功能规格，详细描述每个功能模块的期望行为：
      - 覆盖：正常流程、边界情况、异常处理
      - 用场景描述行为，每个场景可独立验证
      - 只描述"做什么"，不描述"怎么做"
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计——实现方案、文件规划
    template: design.md
    instruction: |
      编写技术设计方案，说明如何实现 proposal 和 specs 中描述的功能：
      - 列出需要创建/修改的文件（含完整路径）
      - 说明关键数据结构、接口、组件
      - 明确各模块之间的依赖和调用关系
      - 如有数据库变更，列出 DDL 或迁移计划
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 实现任务列表——可执行的任务拆解
    template: tasks.md
    instruction: |
      将工作拆分为可执行的实现任务：
      - 每个任务应是一个独立、可验证的工作单元
      - 任务必须使用 checkbox 格式（- [ ]）
      - 按依赖关系排序，先基础设施后具体功能
      - 每个任务应在 15-30 分钟内可完成
      - 标注任务之间的依赖关系
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    按 tasks.md 中的顺序逐个执行任务。

    每个任务完成后：
    1. 验证任务是否真正完成（测试通过、功能正常）
    2. 验证通过后→标记完成（- [ ] → - [x]）
    3. 继续下一个任务

    全部任务完成后：
    1. 运行完整测试套件
    2. 验证所有 spec 已满足
