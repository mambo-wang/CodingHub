name: ui-design-to-browser-test
version: 3
description: 原子化TDD工作流 + UI/UX设计系统 + 浏览器预览验证

artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更提案——为什么做、期望什么行为
    template: proposal.md
    instruction: |
      创建一份变更提案，说明为什么要做这个改动。
      必须用WHEN/THEN格式列出每一个可测试行为：
      - WHEN <函数名>(<输入>) 被调用 THEN 结果为 <期望值>
      只描述"期望发生什么"，不要描述实现细节。
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: 行为规格——用场景描述期望行为
    template: spec.md
    instruction: |
      用 GIVEN/WHEN/THEN 格式编写行为规格：
      - 每个场景必须可独立测试
      - 覆盖：正常路径、边界情况、错误处理
      - 只描述期望行为，不描述实现方式
    requires:
      - proposal

  - id: design-system
    generates: design-system.md
    description: |
      UI/UX 设计系统——pattern/style/colors/typography/组件规范
      【仅当改动涉及前端 UI 时生成】
    template: design-system.md
    instruction: |
      【可选 artifact】仅当改动涉及前端界面修改时执行。

      使用 ui-ux-pro-max skill 生成完整的设计系统：
      ```bash
      python3 skills/ui-ux-pro-max/scripts/search.py "<产品类型> <行业> <风格关键词>" --design-system -p "<项目名>" -f markdown
      ```

      如不需要生成 UI，此 artifact 可跳过。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计——怎么实现、测试策略
    template: design.md
    instruction: |
      编写技术设计方案，说明如何实现。
      必须包含：
      - 要创建的文件列表（测试文件+源码文件，给出完整路径）
      - 每个测试文件的测试策略（单元测试/集成测试）
      - 源码文件与测试文件的对应关系
      - 测试运行命令

      【如有 UI 改动，增加以下内容】
      - UI 组件清单：基于 design-system 定义需要实现的组件
      - 页面布局说明：基于 design-system 说明主要页面的结构和响应式策略
    requires:
      - proposal
      - specs

  - id: impact-analysis
    generates: impact-analysis.md
    description: |
      代码影响范围分析——基于 design.md 中的文件/类清单执行 codegraph 扫描
      【条件必选】仅当 design 涉及修改现有代码时执行；纯新增模块/页面可跳过
    template: impact-analysis.md
    instruction: |
      【条件必选 artifact】执行规则：
      1. 读取 design.md 中的文件列表、类列表、源码文件与测试文件对应关系
      2. 判定改动类型：
         - design.md 中所有源码文件均为新增 → 跳过此 artifact
         - design.md 中存在任意现有源码文件 → 必须执行
      3. 若需执行，使用 Task(code-explorer) 子代理扫描代码库：
         - 以 design.md 中列出的现有类/函数/组件/API 作为 codegraph 入口
         - 追踪直接调用方与传递调用方（深度 2-3 层）
         - 列出依赖的上游服务（repository、config、util）
         - 找出受影响的测试文件
         - 检查 design.md 的源码文件与测试文件对应关系是否完整
         - 评估改动风险等级（L0 纯新增 / L1 修改公共 API / L2 修改 schema 或业务规则）
         - 生成回归测试建议清单
      4. 校验后端层级依赖仍合法：
         ```bash
         bash scripts/lint-arch.sh
         ```
         若 FAIL 必须修复 design 后再继续
      5. 若发现 design.md 漏掉受影响文件/测试，必须在报告中列出“设计修正建议”
      6. 报告保存到 impact-analysis.md
    requires:
      - design

  - id: ui-preview
    generates: ui-preview.html
    description: |
      HTML 界面预览——基于 design-system 与 ui-ux-pro-max 设计规范生成可交互的 UI 原型
      【仅当改动涉及前端 UI 时生成】
    template: ui-preview.md
    instruction: |
      【可选 artifact】仅当改动涉及前端界面修改时执行。

      使用 ui-ux-pro-max skill 获取设计规范与样式决策，然后生成 HTML 预览页面。
      目的：让用户直观预览最终效果，作为视觉验收标准。

      ## 第一步：调用 ui-ux-pro-max 获取设计规范
      基于 design-system.md 的产品类型与风格，调用 ui-ux-pro-max 检索样式、配色、字体、UX 规则：
      ```bash
      python3 ~/.agents/skills/ui-ux-pro-max/scripts/search.py "<产品类型> <行业> <风格关键词>" --design-system -p "<项目名>" -f markdown
      ```
      可按需指定领域：
      ```bash
      python3 ~/.agents/skills/ui-ux-pro-max/scripts/search.py "<查询>" --domain style --max-results 5
      python3 ~/.agents/skills/ui-ux-pro-max/scripts/search.py "<查询>" --domain ux --max-results 5
      ```

      ## 第二步：生成 HTML 预览
      基于 design-system.md 和 ui-ux-pro-max 的输出生成代码：

      生成要求：
      1. 基于 design-system.md 中的设计规范生成代码
      2. 必须生成可运行的 HTML 文件（使用 Tailwind CDN）
      3. 包含页面主要状态的预览：正常态、悬停态、加载态、空状态
      4. 所有图标使用 SVG（Lucide 或 Heroicons），禁止 emoji
      5. 文件保存到 ui-preview.html
      6. 生成后使用 preview_url 工具打开预览

      如不需要生成 UI，此 artifact 可跳过。
    requires:
      - design-system
      - design

  - id: tasks
    generates: tasks.md
    description: 原子化TDD任务列表 + UI实现任务 + 浏览器测试任务
    template: tasks.md
    instruction: |
      关键要求：将工作拆分为原子化 TDD 任务 + UI 实现任务 + 浏览器测试任务。

      【前置参考】如 impact-analysis.md 已生成，必须参考其调用图、受影响测试、
      回归测试建议和设计修正建议；如已跳过（纯新增场景），直接按 design.md 拆分。

      ## A. TDD 任务（后端/业务逻辑）
      每个任务必须是且仅是一个 TDD 阶段（RED / GREEN / REFACTOR）。
      必须使用checkbox格式书写每个任务：
      ### Feature: [功能名称]
      - [ ] RED: 编写失败测试——[测试什么行为]
      - [ ] GREEN: 最小实现——[实现描述，引用对应的RED任务]
      - [ ] REFACTOR: 重构清理——[清理描述]（可选）
      规则：
      1. 禁止将RED和GREEN合并到一个任务
      2. 每个GREEN任务必须引用对应的RED测试
      3. 每个任务必须使用"- [ ]" checkbox格式
      4. 任务严格交替：RED→GREEN→（可选REFACTOR）
      5. 每个任务应在2-5分钟内可完成

      ## B. UI 实现任务（前端）【如有 UI 改动】
      基于 ui-preview.html 和 design-system.md 创建 UI 任务：
      ### UI: [组件/页面名称]
      - [ ] 实现 [组件名]——基于 design-system 规范，参考 ui-preview.html
      - [ ] 验证 [组件名]——视觉检查是否符合设计规范
      规则：
      1. UI 任务在 TDD 任务完成后执行
      2. 每个组件独立一个任务块
      3. 必须引用 design-system 和 ui-preview 作为验收参考

      【如无 UI 改动，此部分可省略】

      ## C. 浏览器测试任务【如有 UI 改动】
      基于 browser-test.md 执行端到端自动化测试：
      ### Test: [测试场景]
      - [ ] TC-XXX: [测试名称]——使用 opencli browser 执行测试
      规则：
      1. 必须在 UI 实现任务完成后执行
      2. 每个测试用例独立一个任务
      3. 必须引用 browser-test.md 作为测试定义来源
      4. 测试前确保 opencli doctor 通过
      5. 测试后记录结果（✅ PASS / ❌ FAIL）
    requires:
      - specs
      - design
      - design-system
      - ui-preview