spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  super-admin:
    username: admin
    password: TestAdmin@1234
  upload:
    base-dir: uploads/tools
    max-file-size: 50MB
    max-request-size: 200MB
    allowed-extensions:
      - zip
      - py
      - js
