server:
  port: 8082
  address: 0.0.0.0

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/ai_tool_square?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2MB

app:
  jwt:
    secret: ai-tool-square-2026-iaihub-secret-key-min-256-bits-for-security
    access-token-expiration: 900000    # 15 min in ms
    refresh-token-expiration: 604800000 # 7 days in ms
  upload:
    # 文件存储根目录，可通过环境变量 AIHUB_FILE_BASE_DIR 覆盖，默认 ~/.aifiles
    base-dir: ${AIHUB_FILE_BASE_DIR:}
    max-file-size: 50MB
    max-request-size: 200MB
    # 工具附件已放开格式限制：allowedExtensions 留空时不做后缀校验
    # 紧急回滚：在下方加回 allowed-extensions: [zip, tar, gz, py, js, ts, md, txt, json, yaml, yml, toml, xml, html, css] 即可恢复白名单
    allowed-extensions: []
  super-admin:
    username: admin
    password: Cloud@1234
  rag:
    base-url: http://localhost:8000

logging:
  level:
    root: INFO
    com.iaihub.toolbox: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
