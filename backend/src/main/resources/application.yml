server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_tool_square?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ai-tool-square-2026-iaihub-secret-key-min-256-bits-for-security
    access-token-expiration: 900000    # 15 min in ms
    refresh-token-expiration: 604800000 # 7 days in ms
  upload:
    base-dir: uploads/tools
    max-file-size: 50MB
    max-request-size: 200MB
    allowed-extensions:
      - zip
      - tar
      - gz
      - py
      - js
      - ts
      - md
      - txt
      - json
      - yaml
      - yml
      - toml
      - xml
      - html
      - css

logging:
  level:
    root: INFO
    com.iaihub.toolbox: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
