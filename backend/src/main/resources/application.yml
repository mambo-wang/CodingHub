server:
  port: 8082
  address: 0.0.0.0

spring:
  main:
    allow-bean-definition-overriding: true
  # 默认使用 mysql profile（向后兼容，种子数据在 MySQL）；启动时可用 --spring.profiles.active=postgresql 切换到 PostgreSQL
  profiles:
    default: mysql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # 方言交由 Hibernate 6 按 JDBC 连接自动探测（MySQLDialect / PostgreSQLDialect），无需硬编码
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2MB

app:
  jwt:
    secret: ai-tool-square-2026-iaihub-secret-key-min-256-bits-for-security
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  upload:
    base-dir: ${AIHUB_FILE_BASE_DIR:}
    max-file-size: 50MB
    max-request-size: 200MB
    allowed-extensions: []
  super-admin:
    username: admin
    password: Cloud@1234
  rag:
    base-url: http://127.0.0.1:8000
    public-url: /rag

logging:
  level:
    root: INFO
    com.iaihub.toolbox: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/ai_tool_square?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

---
spring:
  config:
    activate:
      on-profile: postgresql
  # 全局引号：仅 PostgreSQL 需要，将标识符加双引号以解决保留字 `user`；
  # 不放 common 以免 H2 测试的手写原生 SQL 受影响
  jpa:
    properties:
      hibernate:
        globally_quoted_identifiers: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_tool_square
    username: codinghub
    password: codinghub
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
